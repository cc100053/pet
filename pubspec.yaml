name: pet
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.2.3+9

environment:
  sdk: ^3.11.0-235.0.dev

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.5
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.2.1
  hive_flutter: ^1.1.0
  # ⚠️ MLKIT SIMULATOR WORKAROUND ⚠️
  # google_mlkit_image_labeling does NOT support iOS Simulator on Xcode 26+
  # UNCOMMENT for REAL DEVICE builds (production/TestFlight)
  # COMMENT OUT for SIMULATOR testing (uses mock labels instead)
  # google_mlkit_image_labeling: ^0.12.0
  image_picker: ^1.1.2
  image_cropper: ^9.1.0
  in_app_review: ^2.0.10
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.1
  app_tracking_transparency: ^2.0.6
  firebase_crashlytics: ^5.0.7
  firebase_messaging: ^16.1.1
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.4.1
  flutter_image_compress: ^2.4.0
  image_gallery_saver_plus: ^4.0.1
  photo_view: ^0.15.0
  package_info_plus: ^9.0.0
  purchases_flutter: 9.10.6
  sign_in_with_apple: ^7.0.1
  supabase_flutter: ^2.5.3
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.17
  provider: ^6.1.5+1
  flutter_timezone: ^4.1.1
  audioplayers: ^6.5.0
  flutter_chat_core: ^2.9.0
  flutter_chat_ui: ^2.11.1
  emoji_picker_flutter: ^4.4.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^20.0.0
  google_mobile_ads: ^8.0.0
  gap: ^3.0.1
  google_fonts: ^8.0.1
  intl: ^0.20.2
  lottie: ^3.1.0
  purchases_ui_flutter: 9.10.6
  scrollview_observer: ^1.26.3
  app_links: 6.4.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  url_launcher_platform_interface: ^2.3.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

dependency_overrides:
  # path_provider_foundation 2.6.0 uses objective_c FFI and can fail to bundle
  # objective_c.framework on some iOS simulator setups.
  path_provider_foundation: 2.5.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/app/
    - assets/bg/
    - assets/bg/free/
    - assets/bg/paid/
    - assets/furniture/
    - assets/equipment/
    - assets/equipment/hats/
    - assets/pet/ghost/ghost_stay.gif
    - assets/pet/ghost/ghost_sleep.gif
    - assets/pet/ghost/ghost_walking.gif
    - assets/pet/ghost/ghost_stay/ghost_stay-01.png
    - assets/pet/ghost/ghost_stay/ghost_stay-02.png
    - assets/pet/ghost/ghost_stay/ghost_stay-03.png
    - assets/pet/ghost/ghost_stay/ghost_stay-04.png
    - assets/pet/ghost/ghost_stay/ghost_stay-05.png
    - assets/pet/ghost/ghost_stay/ghost_stay-06.png
    - assets/pet/ghost/ghost_stay/ghost_stay-07.png
    - assets/pet/ghost/ghost_stay/ghost_stay-08.png
    - assets/pet/ghost/ghost_stay/ghost_stay-09.png
    - assets/pet/ghost/ghost_stay/ghost_stay-10.png
    - assets/pet/ghost/ghost_stay/ghost_stay-11.png
    - assets/pet/ghost/ghost_stay/ghost_stay-12.png
    - assets/pet/ghost/ghost_stay/ghost_stay-13.png
    - assets/pet/cat/
    - assets/pet/fish/
    - assets/pet/tiger/
    - assets/pet_sequences/ghost/stay/
    - assets/pet_sequences/ghost/sleep/
    - assets/pet_sequences/ghost/walk/
    - assets/pet_sequences/cat/stay/
    - assets/pet_sequences/cat/sleep/
    - assets/pet_sequences/cat/walk/
    - assets/pet_sequences/fish/stay/
    - assets/pet_sequences/fish/sleep/
    - assets/pet_sequences/fish/walk/
    - assets/pet_sequences/tiger/stay/
    - assets/pet_sequences/tiger/sleep/
    - assets/pet_sequences/tiger/walk/
    - assets/icon/
    - assets/shop/
    - assets/shop/icon/
    - assets/sound/

  fonts:
    - family: Heiseijyoji
      fonts:
        - asset: assets/font/HeiseijyojiFont.otf
    - family: ChildJPZh
      fonts:
        - asset: assets/font/child_JP_zh.otf
    - family: LittleKidsHandwriting
      fonts:
        - asset: assets/font/LittleKidsHandwriting-Regular.otf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
