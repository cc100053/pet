<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サポート - PetTomo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .contact-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-top: 20px;
            text-align: center;
        }

        button {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 50px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>

<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="../assets/app/PetTomo_appicon.png" alt="PetTomo Logo" width="100" style="border-radius: 20px;">
    </div>
    <h1>アプリサポート</h1>
    <p>PetTomoについてお困りですか？サポートいたします！</p>

    <div class="contact-box">
        <h2>お問い合わせ</h2>
        <p>問題、バグ報告、フィードバックがある場合は、サポートフォームにご記入ください：</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeSpKD1y1eLVa3RkjhNh769GkRRAVXFUbjh94S148DUc-186A/viewform?usp=publish-editor"
            target="_blank">
            <button>サポートフォームを開く</button>
        </a>
    </div>

    <footer>
        <p>&copy; 2026 PetTomo Team. All rights reserved.</p>
    </footer>
</body>

</html>
