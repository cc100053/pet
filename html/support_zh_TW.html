<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支援 - PetTomo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 20px;
            flex-wrap: wrap;
        }

        .lang-switcher a {
            text-decoration: none;
            color: #007AFF;
            border: 1px solid #007AFF;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .lang-switcher a.active {
            background: #007AFF;
            color: #fff;
        }

        .contact-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-top: 20px;
            text-align: center;
        }

        button {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 50px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>

<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="PetTomo_appicon.png" alt="PetTomo Logo" width="100" style="border-radius: 20px;">
    </div>
    <div class="lang-switcher" aria-label="Language switcher">
        <a href="support.html?lang=en">English</a>
        <a href="support_ja.html?lang=ja">日本語</a>
        <a class="active" href="support_zh_TW.html?lang=zh-TW">繁體中文</a>
        <a href="support_ko.html?lang=ko">한국어</a>
    </div>
    <h1>應用程式支援</h1>
    <p>需要 PetTomo 的協助？我們隨時為您服務！</p>

    <div class="contact-box">
        <h2>聯絡我們</h2>
        <p>如果您有任何問題、錯誤報告或反饋，請填寫我們的支援表格：</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdQ4T-Ab_fW7r_0Fu8xdytYZJg5x8MZtP4AE3dBuvQeqi5HDg/viewform?usp=publish-editor"
            target="_blank">
            <button>開啟支援表格</button>
        </a>
    </div>

    <footer>
        <p>&copy; 2026 PetTomo 團隊。保留所有權利。</p>
    </footer>
</body>

</html>
