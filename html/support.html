<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - PetTomo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .contact-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-top: 20px;
        }

        .faq-item {
            margin-bottom: 20px;
        }

        .faq-question {
            font-weight: bold;
            font-size: 1.1em;
            color: #007AFF;
            cursor: pointer;
        }

        .faq-answer {
            margin-top: 5px;
        }

        button {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="../assets/app/PetTomo_appicon.png" alt="PetTomo Logo" width="100" style="border-radius: 20px;">
    </div>
    <h1>App Support</h1>
    <p>Need help with PetTomo? We're here to assist you!</p>

    <div class="contact-box" style="text-align: center;">
        <h2>Contact Us</h2>
        <p>If you have any issues, bug reports, or feedback, please fill out our support form:</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeSpKD1y1eLVa3RkjhNh769GkRRAVXFUbjh94S148DUc-186A/viewform?usp=publish-editor"
            target="_blank">
            <button style="font-size: 1.2em; padding: 15px 30px; margin-top: 10px;">Open Support Form</button>
        </a>
    </div>


    <footer>
        <p>&copy; 2026 PetTomo Team. All rights reserved.</p>
    </footer>
</body>

</html>
