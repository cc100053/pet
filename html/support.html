<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - PetTomo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 10px 0 20px;
            flex-wrap: wrap;
        }

        .lang-switcher a {
            text-decoration: none;
            color: #007AFF;
            border: 1px solid #007AFF;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .lang-switcher a.active {
            background: #007AFF;
            color: #fff;
        }

        .contact-box {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
            margin-top: 20px;
        }

        button {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            margin-top: 50px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            if (params.has('lang')) {
                return;
            }
            const lang = (navigator.language || '').toLowerCase();
            const path = window.location.pathname;
            if (!path.endsWith('/support.html') && !path.endsWith('support.html')) {
                return;
            }
            if (lang.startsWith('ja')) {
                window.location.replace('support_ja.html');
                return;
            }
            if (lang.startsWith('zh-tw') || lang.startsWith('zh-hk') || lang.startsWith('zh-hant')) {
                window.location.replace('support_zh_TW.html');
            }
        })();
    </script>
</head>

<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="PetTomo_appicon.png" alt="PetTomo Logo" width="100" style="border-radius: 20px;">
    </div>
    <div class="lang-switcher" aria-label="Language switcher">
        <a class="active" href="support.html?lang=en">English</a>
        <a href="support_ja.html?lang=ja">日本語</a>
        <a href="support_zh_TW.html?lang=zh-TW">繁體中文</a>
    </div>
    <h1>App Support</h1>
    <p>Need help with PetTomo? We're here to assist you!</p>

    <div class="contact-box" style="text-align: center;">
        <h2>Contact Us</h2>
        <p>If you have any issues, bug reports, or feedback, please fill out our support form:</p>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdQ4T-Ab_fW7r_0Fu8xdytYZJg5x8MZtP4AE3dBuvQeqi5HDg/viewform?usp=publish-editor"
            target="_blank">
            <button style="font-size: 1.2em; padding: 15px 30px; margin-top: 10px;">Open Support Form</button>
        </a>
    </div>


    <footer>
        <p>&copy; 2026 PetTomo Team. All rights reserved.</p>
    </footer>
</body>

</html>
