name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true

      - name: Prepare offline test configuration
        run: |
          test ! -e .env
          test ! -e lib/firebase_options.dart
          cp .github/fixtures/app.env .env
          cp .github/fixtures/firebase_options.dart lib/firebase_options.dart
          scripts/write_app_env.sh

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

      - name: Check documentation links
        run: scripts/check_doc_links.sh
